version: 2
project_name: ktop

before:
  hooks:
    - go mod tidy

builds:
  - id: ktop
    main: ./cmd/ktop
    binary: ktop
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: ktop
    ids:
      - ktop
    formats:
      - tar.gz
    name_template: "ktop_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: false
    files:
      - README.md
      - LICENSE
      - src: completions/*
        dst: completions

homebrew_casks:
  - name: ktop
    binaries:
      - ktop
    repository:
      owner: miraxmetov
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    directory: Casks
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_TOKEN" "" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/miraxmetov/ktop
    description: A terminal window into one Kubernetes namespace
    license: mit
    commit_author:
      name: miraxmetov
      email: t.miraxmetov@proximaops.io
    completions:
      bash: completions/ktop.bash
      zsh: completions/_ktop
      fish: completions/ktop.fish
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ktop"]
          end

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
